name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  releases: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DOUAI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOUAI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOUAI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOUAI_RELEASE_KEY_PASSWORD }}
          KEYSTORE_ASSET_ID: '765494043'
          KEYSTORE_ASSET_SHA256: 'd6d6aedfd0720180992891e186b6dd5333ee1526d5908863f9616a7194f8f7b3'
          CREDENTIALS_ASSET_ID: '765510627'
        run: |
          set -eu
          keystore="$RUNNER_TEMP/douai-release.jks"
          credentials="$RUNNER_TEMP/signing-credentials.txt"
          source_desc=""

          download_asset() {
            local asset_id="$1" out="$2"
            curl -sSL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GITHUB_TOKEN" \
              -o "$out" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          }

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
            source_desc="repository secrets"
          else
            echo "release signing secrets are incomplete; falling back to the protected keystore asset" >> "$GITHUB_STEP_SUMMARY"
            download_asset "$KEYSTORE_ASSET_ID" "$keystore"
            actual=$(sha256sum "$keystore" | cut -d' ' -f1)
            if [ "$actual" != "$KEYSTORE_ASSET_SHA256" ]; then
              echo "::error::keystore asset digest mismatch (expected $KEYSTORE_ASSET_SHA256, got $actual)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            download_asset "$CREDENTIALS_ASSET_ID" "$credentials"
            source_desc="protected assets $KEYSTORE_ASSET_ID/$CREDENTIALS_ASSET_ID"
            {
              read -r STORE_PASSWORD
              read -r KEY_ALIAS
              read -r KEY_PASSWORD
            } < "$credentials"
          fi

          chmod 600 "$keystore"
          {
            echo "DOUAI_RELEASE_STORE_FILE=$keystore"
            echo "DOUAI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DOUAI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "DOUAI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "release signing enabled with alias '$KEY_ALIAS' from $source_desc" >> "$GITHUB_STEP_SUMMARY"

      - name: Test local verification tools
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Assemble minified Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Run unit tests and Release APK contracts
        id: unit_tests
        shell: bash
        run: |
          set -eu
          apk=""
          for candidate in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$candidate" ]; then apk="$candidate"; break; fi
          done
          if [ -z "$apk" ]; then
            echo "no release APK produced" >&2
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi
          echo "verifying $apk"
          DOUAI_VERIFY_RELEASE_APK="$GITHUB_WORKSPACE/$apk" ./gradlew :app:testDebugUnitTest --console=plain

      - name: Report all host contracts
        if: always() && steps.unit_tests.outcome != 'skipped'
        shell: bash
        run: |
          python3 -B tools/release_verification.py host-summary --summary app/build/reports/host-contracts.md

      - name: Run Release Lint
        if: ${{ !cancelled() }}
        id: release_lint
        run: ./gradlew :app:lintRelease --console=plain

      - name: Check reviewed Lint warning budget
        if: always() && steps.release_lint.outcome != 'skipped'
        run: python3 -B tools/lint_budget.py check --report app/build/reports/lint-results-release.xml --output app/build/reports/lint-budget.json

      - name: Report APK signature and digest
        if: always()
        shell: bash
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            echo "no APK to inspect" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### ${apk##*/}" >> "$GITHUB_STEP_SUMMARY"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          if "$build_tools/apksigner" verify --print-certs "$apk" >> "$GITHUB_STEP_SUMMARY" 2>&1; then
            echo "APK is signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Release APK is not signed; refusing to publish an installable artifact" >> "$GITHUB_STEP_SUMMARY"
            echo "APK is unsigned" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douai-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/*.apk

      - name: Preserve verification reports and R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/reports/lint-budget.*
            app/build/reports/host-contracts.md
            app/build/outputs/mapping/release/
